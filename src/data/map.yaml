# Settings for the live map at /map/ (S08). The map reads its frames straight from R2.
# To edit: open this file on GitHub, click the pencil, change it, commit. The site redeploys
# in a few minutes. A mistake here stops the build with the field named, so the live site
# stays as it was.

# false: /map/ works but isn't in the menu or the sitemap, and asks search engines to skip it.
# true: "Map" joins the menu and the sitemap (milestone M2).
public: true

# Where the pipeline publishes (S07): index.json lists the last 2 h of frames per layer,
# catalog.json everything online (48 h, D29).
data:
  index: https://data.precip.science/live/index.json
  catalog: https://data.precip.science/live/catalog.json

# D30: a Protomaps extract of OpenStreetMap on R2, styled to the Art glass palette. Until
# that file is uploaded (pipeline: ops/r2-put-basemap.sh), or if it fails to load, a small
# Natural Earth map stands in.
basemap:
  pmtiles: https://data.precip.science/basemap/protomaps-conus-v1.pmtiles
  standin: /map/basemap/standin-v1.json

# The layer the map opens on: echo_type, convectivity, composite, precip_rate or precip_flag.
default_layer: echo_type

# D31: loop lengths. Longer loops skip frames so each loop stays about 60-100 frames.
windows:
  - { hours: 2, step_minutes: 2 }
  - { hours: 6, step_minutes: 6 }
  - { hours: 48, step_minutes: 30 }

# A banner warns when the newest frame is older than this.
stale_after_minutes: 12
